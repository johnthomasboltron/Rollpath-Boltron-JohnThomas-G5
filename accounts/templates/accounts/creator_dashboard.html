<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creator Dashboard | Rollpath</title>
</head>
<body>
    <h1>Creator Dashboard</h1>
    <h1>Welcome, {{ user.profile.display_name }}!</h1>
    <p>Design, simulate, and publish your physics-puzzle levels.</p>
    <a href="{% url 'profile' %}">My Profile</a>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</body>
</html>
